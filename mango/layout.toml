[global]

# Scroller Layout (niri-style column layout)
scroller_structs = 3
scroller_default_proportion = 0.5
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1
edge_scroller_pointer_focus = 0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.33333, 0.5, 0.66667]

# Master-Stack Layout
new_is_master = 1
default_master_factor = 0.55
default_master_count = 1
smart_gaps = 0

# Overview
hotarea_size = 10
enable_hotarea = 1
# ov_tab_mode was removed in mango 0.16 and has no replacement; dropped.
overview_gap_inner = 5
overview_gap_outer = 30

# ------------------------------------------------------------
# Layout per tag (all scroller to match niri's column layout)
# ------------------------------------------------------------

