[global]

# Window effects (migrated from niri shadow)
blur = 1
blur_layer = 1
shadows = 1
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 30
shadows_blur = 30
shadows_position_x = 0
shadows_position_y = 5
shadows_color = 0xffffff40

# Opacity
focused_opacity = 1.0
unfocused_opacity = 1.0

# Animation (disabled to match niri's commented-out animations)
animations = 0
layer_animations = 0

# Appearance
gap_inner_horizontal = 0
gap_inner_vertical = 0
gap_outer_horizontal = 0
gap_outer_vertical = 0

scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9

# Border (niri: off, width 4, active #ffc87f, inactive #505050, urgent #9b0000)
border_px = 0
root_color = 0x201b14ff
border_color = 0x505050ff
focus_color = 0xffc87fff
urgent_color = 0x9b0000ff

# State colors
maximized_screen_color = 0x89aa61ff
scratchpad_color = 0x516c93ff
global_color = 0xb153a7ff
overlay_color = 0x14a57cff

# Cursor
cursor_size = 20
cursor_theme = "Bibata-Modern-Ice"
