# Laptop display: 2560p, 165Hz, positioned at origin
monitorrule=name:^eDP-1$,width:2560,height:1600,refresh:165,x:0,y:10,scale:1
monitorrule=name:^eDP-2$,width:2560,height:1600,refresh:165,x:0,y:10,scale:1

