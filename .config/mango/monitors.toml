# ============================================================
# Monitor rules
# ============================================================

# Laptop display: 2560p, 165Hz, positioned at origin
[[rule.monitor_rule]]
name = "^eDP-1$"
width = 2560
height = 1600
refresh = 165
x = 0
y = 10
scale = 1

[[rule.monitor_rule]]
name = "^eDP-2$"
width = 2560
height = 1600
refresh = 165
x = 0
y = 10
scale = 1

# Match by make and model instead of name
