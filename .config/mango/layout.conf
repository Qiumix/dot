# Scroller Layout (niri-style column layout)
scroller_structs=3
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.33333,0.5,0.66667

# Master-Stack Layout
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview
hotarea_size=10
enable_hotarea=1
ov_tab_mode=1
overviewgappi=5
overviewgappo=30

# Layout per tag (all scroller to match niri's column layout)
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller
tagrule=id:10,layout_name:scroller
tagrule=id:11,layout_name:scroller
tagrule=id:12,layout_name:scroller
tagrule=id:13,layout_name:scroller
tagrule=id:14,layout_name:scroller
tagrule=id:15,layout_name:scroller
tagrule=id:16,layout_name:scroller
tagrule=id:17,layout_name:scroller
tagrule=id:18,layout_name:scroller
tagrule=id:19,layout_name:scroller

# Layer rules
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=animation_type_open:zoom,layer_name:fozzel
layerrule=animation_type_close:zoom,layer_name:fozzel
