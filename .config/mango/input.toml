[global]

# Keyboard
repeat_rate = 60
repeat_delay = 180
numlock_on = 1
xkb_rules_layout = "us"

# Mouse
mouse_natural_scrolling = 0
mouse_accel_profile = 2
mouse_accel_speed = 0.5

# Trackpad
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 0
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1
trackpad_click_method = 2
trackpad_accel_profile = 2
trackpad_accel_speed = 1.0
trackpad_scroll_factor = 0.7
