# ============================================================
# Key Bindings (migrated from niri)
# ============================================================

# Reload config
bind=SUPER,r,reload_config

# Quit
bind=SUPER+SHIFT,E,quit

# Menu and terminal
bind=SUPER,D,spawn,fuzzel
bind=SUPER,t,spawn,kitty -1

# Close window
bind=SUPER,q,killclient

# Overview
bind=SUPER,o,toggleoverview

# Toggle floating
bind=ALT,backslash,togglefloating
bind=SUPER,Return,togglefloating

# Toggle fullscreen / maximize
bind=ALT,f,togglefullscreen
bind=ALT+SHIFT,f,togglefakefullscreen
bind=ALT,a,togglemaximizescreen
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER+CTRL,f,set_proportion,1.0

# Toggle global / scratchpad / minimize
bind=SUPER,g,toggleglobal
bind=ALT,z,toggle_scratchpad
bind=SUPER,i,minimized
bind=SUPER+SHIFT,I,restore_minimized

# Switch window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,j,viewtoright,0
bind=SUPER,k,viewtoleft,0

# Swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# Tag switch
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move window to tag
bind=ALT,1,tag,1,0
bind=ALT,2,tag,2,0
bind=ALT,3,tag,3,0
bind=ALT,4,tag,4,0
bind=ALT,5,tag,5,0
bind=ALT,6,tag,6,0
bind=ALT,7,tag,7,0
bind=ALT,8,tag,8,0
bind=ALT,9,tag,9,0

# Move window to tag (niri style: Mod+Ctrl+N)
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# Move window to tag (niri style: Mod+Shift+N)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Monitor switch
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# Gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# Move column/window (niri: Mod+Ctrl+H/J/K/L)
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,k,tagtoleft,0
bind=SUPER+CTRL,j,tagtoright,0
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right

# Resize floating window
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# ============================================================
# Mouse Button Bindings
# ============================================================
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings (niri style)
axisbind=SUPER,UP,focusdir,left
axisbind=SUPER,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,viewtoleft_have_client
axisbind=SUPER+SHIFT,DOWN,viewtoright_have_client
axisbind=SUPER+CTRL,UP,exchange_client,left
axisbind=SUPER+CTRL,DOWN,exchange_client,right

# ============================================================
# niri-style app launchers & tools
# ============================================================

# DMS clipboard
bind=SUPER,v,spawn_shell,dms ipc clipboard open

# Color picker
bind=SUPER,F1,spawn,hyprpicker -a

# Toggle waybar
bind=SUPER,F12,spawn_shell,pgrep waybar && pkill waybar || waybar

# Toggle sunshine
bind=SUPER,F11,spawn_shell,systemctl enable --user --now sunshine.service

# Toggle kanata
bind=SUPER,F10,spawn_shell,if pgrep -x kanata > /dev/null; then pkill -x kanata; else kanata & notify-send 'Kanata' 'Kanata start'; fi

# Toggle dms
bind=SUPER,F9,spawn_shell,pgrep dms && dms kill || dms run

# DMS lock
bind=SUPER+ALT,L,spawn_shell,dms ipc lock lock

# Wlogout
bind=SUPER,X,spawn,wlogout

# Cycle proportion presets
bind=SUPER,r,switch_proportion_preset
bind=ALT,x,switch_proportion_preset

# ============================================================
# Audio
# ============================================================
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-
bind=CTRL,XF86AudioRaiseVolume,spawn,brightnessctl --class=backlight set +10%
bind=CTRL,XF86AudioLowerVolume,spawn,brightnessctl --class=backlight set 10%-

# Media controls
bind=CTRL+ALT,P,spawn_shell,playerctl play-pause --player=splayer
bind=CTRL+ALT,0,spawn_shell,playerctl next --player=splayer
bind=CTRL+ALT,9,spawn_shell,playerctl previous --player=splayer

# Screenshot
bind=NONE,Print,spawn_shell,grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind=CTRL,Print,spawn_shell,grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind=ALT,Print,spawn_shell,grim -g "$(slurp -o)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png