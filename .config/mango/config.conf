# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=0
cursor_hide_timeout=10
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=20
cursor_theme=Bibata-Modern-Ice
cursor_hide_timeout=15
drag_tile_to_tile=1
xwayland_persistence=0
syncobj_enable=1

source=~/.config/mango/appearance.conf
source=~/.config/mango/bind.conf
source=~/.config/mango/env.conf
source=~/.config/mango/exec.conf
source=~/.config/mango/input.conf
source=~/.config/mango/layout.conf
source=~/.config/mango/monitors.conf
source=~/.config/mango/rules.conf

# DMS Include Configs
source=./dms/layout.conf
