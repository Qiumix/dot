[general]
anchor = top
hot_reloading = true
hard_reloading = true

[modules]
left = niri.workspaces, niri.window, hyprland.workspaces, hyprland.window, media
center = date, time
right = net.upload, net.download, volume, cpu, memory

[style]
background = rgba(0, 0, 0, 0.736)
spacing = 0 0 0 0
padding = 0 0 0 0
width = 1707
height = 30

[module_style]
font_size = 17
icon_size = 20
text_color = rgb(235, 219, 178)
icon_color = rgb(235, 219, 178)

[module:time]
icon_size = 24
format = %H:%M:%S

[module:date]
first_weekday = sunday

[module:battery]
spacing = 5

[module:memory]
padding = 0 9 0 -18

[module:cpu]
padding = 0 0 0 -18

[module:media]
spacing = 20
players = splayer-next, splayer
padding = 0 0 0 -18

[module:net_upload]
icon = 󰕒
padding = 0 0 0 0

[module:net_download]
icon = 󰇚
padding = 0 -12 0 -28

[module:niri.workspaces]
spacing = 5
padding = 0 4 0 0
icon_margin = -2 0 0 8
icon_size = 25
active_size = 25

[module:niri.window]
max_length = 10
show_app_id = true

[popup_style]
height = 300
width = 350
