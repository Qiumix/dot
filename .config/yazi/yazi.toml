#:schema https://yazi-rs.github.io/schemas/yazi.json
[mgr]
  show_hidden  = true
  show_symlink = true
  sort_by      = "natural"

[opener]
  edit = [{ run = "$EDITOR %s", desc = "$EDITOR", block = true, for = "unix" }]
  exif_show = [
    { run = "exiftool-rs %s; echo 'Press enter to exit'; read _", block = true, desc = "Show EXIF", for = "unix" },
  ]
  extract = [{ run = "unar %s", desc = "Extract here", for = "unix" }]
  play = [{ run = "mpv --loop-file=no %s &>/dev/null &" }]
  sqlite = [{ run = "litecli %s", desc = "litecli for sqlite", block = true }]
  xdg-open = [
    { run = "xdg-open %s1", desc = "xdg-open", block = false, for = "linux" },
  ]

[open]
  prepend_rules = [
    { url = "*.{md,xhtml,html,kdl}", use = "edit" },
    { url = "*.{epub}", use = "xdg-open" },
    { url = "*.{db}", use = "sqlite" },
  ]

[preview]
  cache_dir     = ""
  image_filter  = "triangle"
  image_quality = 90
  max_height    = 2000
  max_width     = 2000
  tab_size      = 4

[[plugin.prepend_fetchers]]
  group = "git"
  run   = "git"
  url   = "*"

[[plugin.prepend_fetchers]]
  group = "git"
  run   = "git"
  url   = "*/"

[plugin]
  prepend_preloaders = [
    # Office Documents
    { mime = "application/openxmlformats-officedocument.*", run = "office" },
    { mime = "application/oasis.opendocument.*", run = "office" },
    { mime = "application/ms-*", run = "office" },
    { mime = "application/msword", run = "office" },
    { url = "*.docx", run = "office" },
  ]

  prepend_previewers = [
    { url = "*.{html,xhtml,csv}", run = 'piper -- bat -p --color=always "$1"' },
    { mime = "application/sqlite3", run = 'piper -- sqlite3 "$1" ".schema --indent" | bat --language sql --color=always --style=plain' },
    { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
    { url = "*/", run = 'piper -- eza -a -TL=2 --color=always --icons=always --group-directories-first --no-quotes "$1"' },
    { url = ".wav", run = 'piper -- ffprobe "$1"' },
    { mime = "application/openxmlformats-officedocument.*", run = "office" },
    { mime = "application/oasis.opendocument.*", run = "office" },
    { mime = "application/ms-*", run = "office" },
    { mime = "application/msword", run = "office" },
    { url = "*.docx", run = "office" },
  ]
