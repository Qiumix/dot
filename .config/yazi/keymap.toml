#:schema https://yazi-rs.github.io/schemas/keymap.json
[[mgr.prepend_keymap]]
on   = ["g", "d"]
run  = "cd ~/Downloads"
desc = "Cd to ~/Downloads"

[[mgr.prepend_keymap]]
on   = ["g", "G"]
run  = "cd ~/Games"
desc = "Cd to ~/Games"

[[mgr.prepend_keymap]]
on   = ["g", "D"]
run  = "cd ~/Documents"
desc = "Cd to ~/Documents"

[[mgr.prepend_keymap]]
on   = ["g", "p"]
run  = "cd ~/Projects"
desc = "Cd to ~/Projects"

[[mgr.prepend_keymap]]
on   = ["g", "P"]
run  = "cd ~/Pictures"
desc = "Cd to ~/Pictures"

[[mgr.prepend_keymap]]
on   = ["g", "v"]
run  = "cd ~/Videos"
desc = "Cd to ~/Videos"

[[mgr.prepend_keymap]]
on   = ["g", "t"]
run  = "cd ~/tmp"
desc = "Cd to ~/tmp"

[[mgr.prepend_keymap]]
on   = ["g", "T"]
run  = "cd /tmp"
desc = "Cd to /tmp"

[[mgr.prepend_keymap]]
on   = ["g", "l"]
run  = 'shell "localsend %s"'
desc = "localsend"

[[mgr.prepend_keymap]]
on   = ["g", "L"]
run  = 'cd ~/.local'
desc = "Cd to ~/.local"

# compress
[[mgr.prepend_keymap]]
on   = ["c", "a", "a"]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = ["c", "a", "p"]
run  = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on   = ["c", "a", "h"]
run  = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on   = ["c", "a", "l"]
run  = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on   = ["c", "a", "u"]
run  = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"

[[mgr.prepend_keymap]]
on   = ["c", "a", "7"]
run  = "plugin compress '-ph 7z'"
desc = "Archive selected files to 7z (password+header)"

[[mgr.prepend_keymap]]
on   = ["c", "a", "r"]
run  = "plugin compress '-p -l rar'"
desc = "Archive selected files to rar (password+level)"

[[mgr.prepend_keymap]]
on  = ["F"]
run = "plugin yafg"

[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

[[mgr.prepend_keymap]]
on   = ["g", "r"]
run  = "plugin cd-git-root"
desc = "Go to git repo root"

[[mgr.prepend_keymap]]
on   = "="
run  = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "Zoom out hovered file"
