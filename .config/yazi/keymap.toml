#:schema https://yazi-rs.github.io/schemas/keymap.json

mgr.prepend_keymap = [
  { on = ["g", "d"], run = "cd ~/Downloads", desc = "Cd to ~/Downloads" },
  { on = ["g", "G"], run = "cd ~/Games", desc = "Cd to ~/Games" },
  { on = ["g", "D"], run = "cd ~/Documents", desc = "Cd to ~/Documents" },
  { on = ["g", "p"], run = "cd ~/Projects", desc = "Cd to ~/Projects" },
  { on = ["g", "P"], run = "cd ~/Pictures", desc = "Cd to ~/Pictures" },
  { on = ["g", "v"], run = "cd ~/Videos", desc = "Cd to ~/Videos" },
  { on = ["g", "t"], run = "cd ~/tmp", desc = "Cd to ~/tmp" },
  { on = ["g", "T"], run = "cd /tmp", desc = "Cd to /tmp" },
  { on = ["g", "l"], run = 'shell "localsend %s"', desc = "localsend" },
  { on = ["g", "L"], run = "cd ~/.local", desc = "Cd to ~/.local" },

  { on = ["c", "a", "a"], run = "plugin compress", desc = "Archive selected files" },
  { on = ["c", "a", "p"], run = "plugin compress -p", desc = "Archive selected files (password)" },
  { on = ["c", "a", "h"], run = "plugin compress -ph", desc = "Archive selected files (password+header)" },
  { on = ["c", "a", "l"], run = "plugin compress -l", desc = "Archive selected files (compression level)" },
  { on = ["c", "a", "u"], run = "plugin compress -phl", desc = "Archive selected files (password+header+level)" },
  { on = ["c", "a", "7"], run = "plugin compress '-ph 7z'", desc = "Archive selected files to 7z (password+header)" },
  { on = ["c", "a", "r"], run = "plugin compress '-p -l rar'", desc = "Archive selected files to rar (password+level)" },

  { on = ["F"], run = "plugin yafg", desc = "" },
  { on = ["g", "r"], run = "plugin cd-git-root", desc = "Go to git repo root" },
  { on = ["="], run = "plugin zoom 1", desc = "Zoom in hovered file" },
  { on = ["-"], run = "plugin zoom -1", desc = "Zoom out hovered file" },
  { on = ["c", "m"], run = "plugin chmod", desc = "Chmod on selected files" },
  { on = ["c", "r"], run = "plugin path-from-root", desc = "Copies path from git root" },
  { on = ["g", "i"], run = "plugin lazygit", desc = "run lazygit" },
]
