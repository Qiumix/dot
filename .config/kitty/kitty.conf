# common
allow_remote_control yes
dynamic_background_opacity yes
enable_audio_bell no
confirm_os_window_close 0
rememver_window_size no
shell fish
# term xterm-256color

# font
font_family           family="Maple Mono NF CN"
bold_font             Maple Mono NF CN SemiBold
italic_font           Maple Mono NF CN Italic
bold_italic_font      Maple Mono NF CN SemiBold Italic
font_size             15.0
disable_ligatures     never

# ui
# # Windows
window_margin_width 3
draw_minimal_borders yes
enabled_layouts splits:split_axis=horizontal
background_blur 10
# # Tab_Bar
tab_bar_edge top
tab_bar_style powerline
# # Cursor
#cursor_trail 1
cursor_trail_decay 0 0.15
cursor_shape_unfocused underline
cursor_blink_interval 0
# # Background
background_opacity 0.75
cursor_shape_unfocused unchanged

# keymap
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+f11 toggle_fullscreen

include nvim_scroll.conf
