#:schema https://yazi-rs.github.io/schemas/keymap.json

mgr.prepend_keymap = [
  # ════════════════════════════════════════════════════════════
  #  g: goto location
  # ════════════════════════════════════════════════════════════
  { on = ["g", "b"], run = "plugin trash", desc = "Go to trash bin" },
  { on = ["g", "D"], run = "cd ~/Documents", desc = "Cd to ~/Documents" },
  { on = ["g", "d"], run = "cd ~/Downloads", desc = "Cd to ~/Downloads" },
  { on = ["g", "G"], run = "cd ~/Games", desc = "Cd to ~/Games" },
  { on = ["g", "l"], run = "cd ~/.local", desc = "Cd to ~/.local" },
  { on = ["g", "P"], run = "cd ~/Pictures", desc = "Cd to ~/Pictures" },
  { on = ["g", "p"], run = "cd ~/Projects", desc = "Cd to ~/Projects" },
  { on = ["g", "r"], run = "plugin cd-git-root", desc = "Go to git repo root" },
  { on = ["g", "t"], run = "cd ~/tmp", desc = "Cd to ~/tmp" },
  { on = ["g", "T"], run = "cd /tmp", desc = "Cd to /tmp" },
  { on = ["g", "v"], run = "cd ~/Videos", desc = "Cd to ~/Videos" },
  { on = ["g", "j"], run = "plugin first-non-directory", desc = "Jumps to the first file" },

  # ════════════════════════════════════════════════════════════
  #  c: copy
  # ════════════════════════════════════════════════════════════
  { on = ["c", "r"], run = "plugin path-from-root", desc = "Copies path from git root" },

  # ════════════════════════════════════════════════════════════
  #  m: misc / external tool
  # ════════════════════════════════════════════════════════════
  { on = ["m", "f"], run = "plugin fd", desc = "Search files fd" },
  # { on = ["m", "F"], run = "plugin fd --args '--no-ignore'", desc = "Search files fd(no ignore)" },
  { on = ["m", "r"], run = "plugin rg", desc = "Search files rg" },
  # { on = ["m", "R"], run = "plugin rg --args '--no-ignore'", desc = "Search files rg(no ignore)" },
  { on = ["m", "g"], run = "plugin lazygit", desc = "Lazygit" },
  { on = ["m", "l"], run = '''shell --block -- bash -c '
    args=()
    for f in "$@"; do
        args+=(-f "$f")
    done
    exec localsend-cli "${args[@]}"
' -- %s''', desc = "localsend-cli" },
  { on = ["m", "L"], run = 'shell "localsend %s"', desc = "localsend" },
  { on = ["m", "m"], run = "plugin chmod", desc = "Chmod on selected files" },
  { on = ["m", "s"], run = 'shell "$SHELL" --block', desc = "Open $SHELL here" },
  { on = ["m", "v"], run = "plugin gridview", desc = "Grid view" },
  { on = ["m", "x"], run = "shell 'xdg-open %s'", desc = "Open with system app" },

  { on = ["m", "t", "c"], run = "plugin toggle-pane max-current", desc = "Maximize or restore the current pane" },
  { on = ["m", "t", "C"], run = "plugin toggle-pane min-current", desc = "Show or hide the current pane" },
  { on = ["m", "t", "p"], run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },
  { on = ["m", "t", "P"], run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },
  { on = ["m", "t", "r"], run = "plugin toggle-pane max-parent", desc = "Maximize or restore the parent pane" },
  { on = ["m", "t", "R"], run = "plugin toggle-pane min-parent", desc = "Show or hide the parent pane" },

  { on = ["m", "c", "j"], run = "plugin convert -- --extension='jpg'", desc = "Convert selected files to JPG" },
  { on = ["m", "c", "p"], run = "plugin convert -- --extension='png'", desc = "Convert selected files to PNG" },
  { on = ["m", "c", "w"], run = "plugin convert -- --extension='webp'", desc = "Convert selected files to WebP" },

  { on = ["m", "o"], run = "plugin open-with-cmd -- block", desc = "Open with command in the terminal" },
  { on = ["m", "O"], run = "plugin open-with-cmd", desc = "Open with command" },
  # ════════════════════════════════════════════════════════════
  #  M: Linemode
  # ════════════════════════════════════════════════════════════
  { on = ["M", "s"], run = "linemode size", desc = "Linemode: size" },
  { on = ["M", "p"], run = "linemode permissions", desc = "Linemode: permissions" },
  { on = ["M", "b"], run = "linemode btime", desc = "Linemode: btime" },
  { on = ["M", "m"], run = "linemode mtime", desc = "Linemode: mtime" },
  { on = ["M", "o"], run = "linemode owner", desc = "Linemode: owner" },
  { on = ["M", "n"], run = "linemode none", desc = "Linemode: none" },

  # ════════════════════════════════════════════════════════════
  #  C: compress / archive
  # ════════════════════════════════════════════════════════════
  { on = ["C", "7"], run = "plugin compress '-ph 7z'", desc = "Archive to 7z (password+header)" },
  { on = ["C", "a"], run = "plugin compress", desc = "Archive" },
  { on = ["C", "h"], run = "plugin compress -ph", desc = "Archive (password+header)" },
  { on = ["C", "l"], run = "plugin compress -l", desc = "Archive (compression level)" },
  { on = ["C", "p"], run = "plugin compress -p", desc = "Archive (password)" },
  { on = ["C", "r"], run = "plugin compress '-p -l rar'", desc = "Archive to rar (password+level)" },
  { on = ["C", "u"], run = "plugin compress -phl", desc = "Archive (password+header+level)" },

  # ════════════════════════════════════════════════════════════
  #  common
  # ════════════════════════════════════════════════════════════
  { on = "F", run = "plugin fr rg", desc = "Search file by content (rg)" },
  { on = "f", run = "plugin fr rga", desc = "Search file by content (rga)" },
  { on = "+", run = "plugin zoom 1", desc = "Zoom in hovered file" },
  { on = "=", run = "plugin zoom -1", desc = "Zoom out hovered file" },
  { on = ["t"], run = "tab_create --current", desc = "Create a new tab in CWD" },
  { on = ["T"], run = "tab_rename --interactive", desc = "Rename current tab" },

  # ════════════════════════════════════════════════════════════
  #  clear default
  # ════════════════════════════════════════════════════════════
  { on = ["m", "s"], run = "noop" },
  { on = ["m", "p"], run = "noop" },
  { on = ["m", "b"], run = "noop" },
  { on = ["m", "m"], run = "noop" },
  { on = ["m", "o"], run = "noop" },
  { on = ["m", "n"], run = "noop" },
  { on = ["s"], run = "noop" },
  { on = ["S"], run = "noop" },
]
